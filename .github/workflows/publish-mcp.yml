name: Publish MCP server to the registry

# Manual: GitHub > Actions > "Publish MCP server to the registry" > Run workflow.
# Signs in with this repository's own GitHub identity (no secret needed) and lists the server described in docs/mcp-registry/server.json.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Sign in to the registry
        run: ./mcp-publisher login github-oidc
      - name: Publish
        working-directory: docs/mcp-registry
        run: ../../mcp-publisher publish
